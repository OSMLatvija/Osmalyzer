<div class="map" id="map_GI_" style="width: 1200px; height: 600px;"></div>
<script>
    var map_GI_ = L.map('map_GI_', {fullscreenControl: true}).setView([56.906, 24.505], 7);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 21,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
    }).addTo(map_GI_);
    
    <!--CLUSTERED-->    
    var mg_GI_ = L.markerClusterGroup(
        {
            showCoverageOnHover: false,
            spiderfyOnMaxZoom: true,
            animate: false,
            maxClusterRadius: 30,
            iconCreateFunction: function (cluster) {
                var icon = 'grayCircle';
                var red = false;
                var green = false;
                var orange = false;
                var purple = false;
                cluster.getAllChildMarkers().forEach(function (marker) {
                    if (marker.group == 'green') green = true;
                    if (marker.group == 'red') red = true;
                    if (marker.group == 'orange') orange = true;
                    if (marker.group == 'purple') purple = true;
                });
                if (red && orange && green && purple) icon = 'redOrangeGreenPurpleCircle';
                else if (red && orange && purple) icon = 'redOrangePurpleCircle';
                else if (red && green && purple) icon = 'redPurpleGreenCircle';
                else if (orange && green && purple) icon = 'purpleOrangeGreenCircle';
                else if (red && purple) icon = 'redPurpleCircle';
                else if (green && purple) icon = 'greenPurpleCircle';
                else if (orange && purple) icon = 'orangePurpleCircle';
                else if (red && orange && green) icon = 'redOrangeGreenCircle';
                else if (red && orange) icon = 'redOrangeCircle';
                else if (orange && green) icon = 'orangeGreenCircle';
                else if (red && green) icon = 'redGreenCircle';
                else if (orange) icon = 'orangeCircle';
                else if (red) icon = 'redCircle';
                else if (green) icon = 'greenCircle';
                return L.divIcon({ html: '<img src=\'icons/'+icon+'.png\' class=\'clusterIcon\'><span class=\'clusterText\'>' + cluster.getChildCount() + '</span>', className: 'cluster', iconSize: L.point(20, 20) });
            }
        });
    <!--END CLUSTERED-->
    <!--UNCLUSTERED-->
    var mg_GI_ = L.featureGroup();
    <!--END UNCLUSTERED-->

    var sg_GI_ = L.featureGroup().addTo(map_GI_);
    map_GI_.removeLayer(sg_GI_);

    var lineGroup_GI_ = L.featureGroup().addTo(map_GI_);

    const markerList_GI_ = [
<!--MARKERS-->
    ];

    markerList_GI_.forEach(data => {
        L.marker([data[0], data[1]], {icon: data[2]})
            .addTo(data[3])
            .bindPopup(data[5], { maxWidth : 560 })
            .group=data[4];
    });

    const lineList_GI_ = [
<!--LINES-->
    ];

    lineList_GI_.forEach(function (data) {
        L.polyline(data[0], { color: data[1] })
            .addTo(lineGroup_GI_)
            .bindPopup(data[2], { maxWidth : 560 });
    });
    
    mg_GI_.addTo(map_GI_);
    map_GI_.on('zoomend', function() {
        if (map_GI_.getZoom() < 14) map_GI_.removeLayer(sg_GI_);
        else map_GI_.addLayer(sg_GI_);
    });

    var fitBounds_GI_ = null;
    if (mg_GI_.getLayers().length > 0)
        fitBounds_GI_ = mg_GI_.getBounds();
    if (lineGroup_GI_.getLayers().length > 0) {
        var lineBounds_GI_ = lineGroup_GI_.getBounds();
        if (fitBounds_GI_ === null)
            fitBounds_GI_ = lineBounds_GI_;
        else
            fitBounds_GI_ = fitBounds_GI_.extend(lineBounds_GI_);
    }

    if (fitBounds_GI_ !== null)
        map_GI_.fitBounds(fitBounds_GI_, { maxZoom: 12, animate: false });
</script>
